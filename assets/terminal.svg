<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580">
  <defs>
    <style>
      .terminal-bg { fill: #1a1b26; }
      .terminal-border { fill: #24283b; }
      .title-bar { fill: #1f2335; }
      .btn-red { fill: #f7768e; }
      .btn-yellow { fill: #e0af68; }
      .btn-green { fill: #9ece6a; }
      .text { font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
      .prompt { fill: #7aa2f7; }
      .command { fill: #c0caf5; }
      .cyan { fill: #7dcfff; }
      .green { fill: #9ece6a; }
      .dim { fill: #565f89; }
      .white { fill: #c0caf5; }
    </style>
  </defs>

  <!-- Window -->
  <rect class="terminal-border" width="960" height="580" rx="12"/>
  <rect class="terminal-bg" x="1" y="1" width="958" height="578" rx="11"/>

  <!-- Title bar -->
  <rect class="title-bar" x="1" y="1" width="958" height="36" rx="11"/>
  <rect class="terminal-bg" x="1" y="26" width="958" height="12"/>

  <!-- Window buttons (vertically centered in 36px bar → cy=18) -->
  <circle class="btn-red" cx="24" cy="12" r="6"/>
  <circle class="btn-yellow" cx="44" cy="12" r="6"/>
  <circle class="btn-green" cx="64" cy="12" r="6"/>

  <!-- Title -->
  <text x="480" y="17" text-anchor="middle" class="text dim" font-size="12">Terminal</text>

  <!-- Content -->
  <g transform="translate(32, 72)">
    <!-- Prompt line -->
    <text class="text prompt" font-size="15" y="0">~</text>
    <text class="text dim" font-size="15" x="16" y="0">$</text>
    <text class="text command" font-size="15" x="36" y="0">npx eclusa</text>

    <!-- Banner -->
    <text class="text cyan" font-size="11" y="40"  xml:space="preserve">   ███████╗ ██████╗██╗     ██╗   ██╗███████╗ █████╗</text>
    <text class="text cyan" font-size="11" y="55"  xml:space="preserve">   ██╔════╝██╔════╝██║     ██║   ██║██╔════╝██╔══██╗</text>
    <text class="text cyan" font-size="11" y="70"  xml:space="preserve">   █████╗  ██║     ██║     ██║   ██║███████╗███████║</text>
    <text class="text cyan" font-size="11" y="85"  xml:space="preserve">   ██╔══╝  ██║     ██║     ██║   ██║╚════██║██╔══██║</text>
    <text class="text cyan" font-size="11" y="100" xml:space="preserve">   ███████╗╚██████╗███████╗╚██████╔╝███████║██║  ██║</text>
    <text class="text cyan" font-size="11" y="115" xml:space="preserve">   ╚══════╝ ╚═════╝╚══════╝ ╚═════╝ ╚══════╝╚═╝  ╚═╝</text>
    <text class="text dim"  font-size="11" y="130" xml:space="preserve">   ━━━╋━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━╋━━━</text>

    <!-- Title and subtitle -->
    <text class="text white" font-size="15" y="164">  Eclusa <tspan class="dim">v0.1.0</tspan></text>
    <text class="text white" font-size="15" y="188">  From noisy intent to constrained, test-backed code.</text>
    <text class="text dim"   font-size="15" y="208">  Built on GSD by TACHES.</text>

    <!-- Install output -->
    <text class="text" font-size="15" y="248"><tspan class="green">  ✓</tspan><tspan class="white"> Installed commands/eclusa</tspan></text>
    <text class="text" font-size="15" y="272"><tspan class="green">  ✓</tspan><tspan class="white"> Installed eclusa</tspan></text>
    <text class="text" font-size="15" y="296"><tspan class="green">  ✓</tspan><tspan class="white"> Installed agents</tspan></text>
    <text class="text" font-size="15" y="320"><tspan class="green">  ✓</tspan><tspan class="white"> Configured hooks</tspan></text>

    <!-- Done message -->
    <text class="text" font-size="15" y="368"><tspan class="green">  Done!</tspan><tspan class="white"> Run </tspan><tspan class="cyan">/eclusa:new-project</tspan><tspan class="white"> to get started.</tspan></text>

    <!-- New prompt -->
    <text class="text prompt" font-size="15" y="416">~</text>
    <text class="text dim" font-size="15" x="16" y="416">$</text>
    <text class="text white" font-size="15" x="36" y="416">▌</text>
  </g>
</svg>
