syntax = "proto3";

package sample;

message User {
  string id = 1;
  string name = 2;
}

message GetUserRequest {
  string id = 1;
}

message ListUsersResponse {
  repeated User users = 1;
}

service UserService {
  rpc GetUser(GetUserRequest) returns (User);
  rpc ListUsers(GetUserRequest) returns (ListUsersResponse);
}
